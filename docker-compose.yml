name: cripticos

services:
  postgres:
    image: postgres:17-alpine
    container_name: cripticos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enigmads
      POSTGRES_USER: enigmads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enigmads_dev}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enigmads -d enigmads"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  postgres_data:
    name: cripticos_postgres_data

networks:
  internal:
    name: cripticos_network
